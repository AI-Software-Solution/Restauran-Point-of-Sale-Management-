apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pos-ingress
  namespace: pos-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - boburmirzo.myrestauran.uz
      secretName: pos-tls
  rules:
    - host: boburmirzo.myrestauran.uz
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pos-backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pos-frontend
                port:
                  number: 80
